<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Tournament Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a tournament desk on one shared device. Holo-foil title card, a sticky tab rail with a
   teacher lock, trainer profile cards, and "pairing slips" (table, trainer, tie, trainer). */
:root{
  --paper:#EDF0F7; --card:#FFFFFF; --ink:#141A33; --ink-2:#4F5877; --line:#D4D9E7; --line-2:#E5E8F1;
  --accent:#2F44E0; --accent-ink:#FFFFFF; --accent-soft:#E3E7FD; --accent-line:#BCC5F7;
  --win:#1B7A52; --win-soft:#DBF1E5; --win-ink:#FFFFFF;
  --tie:#96600F; --tie-soft:#FAEDD3; --tie-ink:#FFFFFF;
  --danger:#B3202D; --danger-soft:#FBE2E4;
  --gold:#D9A520; --silver:#A3ACBD; --bronze:#C07A43; --medal-ink:#17110A;
  --holo-1:#C7ECFF; --holo-2:#E4D7FF; --holo-3:#FFD9EC; --holo-4:#FFF0C4; --holo-5:#CBF5E3;
  --holo-ink:#141A33; --holo-edge:#C9D0E5; --holo-rule:rgba(20,26,51,.16); --foil-line:rgba(255,255,255,.38);
  --sheen:rgba(255,255,255,.75); --chip-on-holo:rgba(255,255,255,.62);
  --shadow:0 1px 0 rgba(20,26,51,.04), 0 12px 28px -18px rgba(20,26,51,.38);
  --backdrop:rgba(12,16,34,.45); --av-ring:rgba(20,26,51,.14); --av-shine:rgba(255,255,255,.32);

  /* Badge colours: fixed hues that sit behind white or dark lettering in either theme */
  --ty-fire:#DD4B26; --ty-water:#2B7AD6; --ty-grass:#2C9554; --ty-lightning:#EFBC17; --ty-psychic:#9547CC;
  --ty-fighting:#B05A25; --ty-darkness:#2E3B4C; --ty-metal:#6A7889; --ty-dragon:#9C7810; --ty-fairy:#D84B91;
  --ty-colourless:#BCC1C9; --ty-ink:#FFFFFF; --ty-ink-dark:#1B1608;

  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1324; --card:#171C33; --ink:#E9ECF8; --ink-2:#A2AAC7; --line:#2B3253; --line-2:#222944;
    --accent:#8796FF; --accent-ink:#0F1324; --accent-soft:#232B57; --accent-line:#3B4692;
    --win:#52C893; --win-soft:#143528; --win-ink:#06150E;
    --tie:#E5B058; --tie-soft:#3A2D14; --tie-ink:#1A1204;
    --danger:#F27C86; --danger-soft:#3D1D23;
    --gold:#E7BC45; --silver:#B3BBCC; --bronze:#D58F5B; --medal-ink:#14100A;
    --holo-1:#1C3658; --holo-2:#33285B; --holo-3:#4A2545; --holo-4:#483D1E; --holo-5:#163F37;
    --holo-ink:#F3F5FF; --holo-edge:#2F3762; --holo-rule:rgba(255,255,255,.18); --foil-line:rgba(255,255,255,.05);
    --sheen:rgba(255,255,255,.16); --chip-on-holo:rgba(255,255,255,.12);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.85);
    --backdrop:rgba(0,0,0,.6); --av-ring:rgba(255,255,255,.18); --av-shine:rgba(255,255,255,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1324; --card:#171C33; --ink:#E9ECF8; --ink-2:#A2AAC7; --line:#2B3253; --line-2:#222944;
  --accent:#8796FF; --accent-ink:#0F1324; --accent-soft:#232B57; --accent-line:#3B4692;
  --win:#52C893; --win-soft:#143528; --win-ink:#06150E;
  --tie:#E5B058; --tie-soft:#3A2D14; --tie-ink:#1A1204;
  --danger:#F27C86; --danger-soft:#3D1D23;
  --gold:#E7BC45; --silver:#B3BBCC; --bronze:#D58F5B; --medal-ink:#14100A;
  --holo-1:#1C3658; --holo-2:#33285B; --holo-3:#4A2545; --holo-4:#483D1E; --holo-5:#163F37;
  --holo-ink:#F3F5FF; --holo-edge:#2F3762; --holo-rule:rgba(255,255,255,.18); --foil-line:rgba(255,255,255,.05);
  --sheen:rgba(255,255,255,.16); --chip-on-holo:rgba(255,255,255,.12);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -18px rgba(0,0,0,.85);
  --backdrop:rgba(0,0,0,.6); --av-ring:rgba(255,255,255,.18); --av-shine:rgba(255,255,255,.22);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

.wrap{
  max-width:1120px; margin-inline:auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}

/* ---------- Avatars ---------- */
.av{
  --s:40px; width:var(--s); height:var(--s); border-radius:50%; overflow:hidden; flex:none;
  display:inline-grid; place-items:center; position:relative; background:var(--line-2);
  box-shadow:inset 0 0 0 1px var(--av-ring); vertical-align:middle;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-badge{background:radial-gradient(circle at 30% 22%, var(--av-shine), transparent 58%), var(--c); color:var(--ci)}
.av-badge svg{position:absolute;width:74%;height:74%;fill:currentColor;opacity:.26}
.av-badge b{position:relative;font-family:var(--font-display);font-weight:800;font-size:calc(var(--s) * .38);letter-spacing:-.02em;line-height:1}
.av-badge b.t3{font-size:calc(var(--s) * .3)}
.ty-fire{--c:var(--ty-fire);--ci:var(--ty-ink)}
.ty-water{--c:var(--ty-water);--ci:var(--ty-ink)}
.ty-grass{--c:var(--ty-grass);--ci:var(--ty-ink)}
.ty-lightning{--c:var(--ty-lightning);--ci:var(--ty-ink-dark)}
.ty-psychic{--c:var(--ty-psychic);--ci:var(--ty-ink)}
.ty-fighting{--c:var(--ty-fighting);--ci:var(--ty-ink)}
.ty-darkness{--c:var(--ty-darkness);--ci:var(--ty-ink)}
.ty-metal{--c:var(--ty-metal);--ci:var(--ty-ink)}
.ty-dragon{--c:var(--ty-dragon);--ci:var(--ty-ink)}
.ty-fairy{--c:var(--ty-fairy);--ci:var(--ty-ink)}
.ty-colourless{--c:var(--ty-colourless);--ci:var(--ty-ink-dark)}

/* ---------- Title card (holo foil) ---------- */
.top{padding-block:20px 14px;display:grid;gap:12px}
.title-card{
  position:relative; overflow:hidden; isolation:isolate;
  border-radius:var(--r-lg); padding:18px 22px 16px; color:var(--holo-ink);
  background:
    repeating-linear-gradient(125deg, transparent 0 7px, var(--foil-line) 7px 8px),
    linear-gradient(118deg, var(--holo-1) 0%, var(--holo-2) 28%, var(--holo-3) 52%, var(--holo-4) 76%, var(--holo-5) 100%);
  border:1px solid var(--holo-edge); box-shadow:var(--shadow);
  display:grid; gap:12px;
}
.title-card::after{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
  background:linear-gradient(105deg, transparent 38%, var(--sheen) 50%, transparent 62%);
  background-size:250% 100%; background-position:-30% 0;
  animation:sheen 2.4s cubic-bezier(.2,.7,.2,1) .35s 1 both;
}
.title-card:hover::after{animation:sheen-again 1.5s cubic-bezier(.2,.7,.2,1) 1 both}
@keyframes sheen{from{background-position:130% 0}to{background-position:-30% 0}}
@keyframes sheen-again{from{background-position:130% 0}to{background-position:-30% 0}}
.tc-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.eyebrow{font-family:var(--font-data);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.season{font-family:var(--font-data);font-weight:700;font-size:13px;padding:4px 11px;border-radius:999px;background:var(--chip-on-holo);white-space:nowrap}
.tc-name{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,5.4vw,52px);line-height:1;letter-spacing:-.025em;margin:2px 0 0;overflow-wrap:anywhere}
.tc-stats{display:flex;flex-wrap:wrap;gap:10px 0;margin:0;border-top:1px solid var(--holo-rule);padding-top:12px}
.tc-stats > div{padding-right:18px;margin-right:18px;border-right:1px solid var(--holo-rule);min-width:0}
.tc-stats > div:last-child{border-right:0;margin-right:0;padding-right:0}
.tc-stats dt{font-size:11px;text-transform:uppercase;letter-spacing:.09em;opacity:.78;font-weight:700}
.tc-stats dd{margin:0;font-family:var(--font-data);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tc-stats dd.leader{display:flex;align-items:center;gap:8px}

.notices{display:grid;gap:8px}
.notices:empty{display:none}
.notice{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;
  padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink)
}
.notice p{margin:0;min-width:0;flex:1 1 280px}
.notice.is-teacher{background:var(--card);border-color:var(--accent);padding-block:9px}
.notice.is-warn{background:var(--tie-soft);border-color:var(--tie)}

/* ---------- Tabs + teacher lock ---------- */
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:none;font:inherit;font-weight:700;color:var(--ink-2);
  padding:14px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
  display:inline-flex;gap:8px;align-items:center
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--font-data);font-size:11.5px;font-weight:700;background:var(--line-2);border-radius:999px;padding:1px 7px;color:var(--ink-2)}
.tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent)}
.mode-btn{
  flex:none;appearance:none;font:inherit;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;white-space:nowrap
}
.mode-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode-btn:hover{color:var(--ink);border-color:var(--ink-2)}
.mode-btn.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.main{padding-block:22px 56px}
.panel-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.panel-head h2{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.panel-head p{margin:4px 0 0;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Controls ---------- */
.btn{
  appearance:none;font:inherit;font-weight:700;font-size:14px;line-height:1.2;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:40px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap
}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn-quiet:hover{background:var(--accent-soft);border-color:transparent}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.is-confirm{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-sm{min-height:32px;padding:6px 10px;font-size:13px}
.input{
  font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;min-height:40px;width:100%;min-width:0
}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;line-height:1.45}
.field{display:grid;gap:6px;min-width:0;margin:0;padding:0;border:0;align-content:start}
.field > label,.field > legend,.field .lbl{font-size:13px;font-weight:700;color:var(--ink-2);padding:0}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-msg{margin:0;font-size:13.5px;min-height:1.2em;color:var(--ink-2)}
.form-msg:empty{display:none}
.form-msg.is-error{color:var(--danger);font-weight:700}
.form-msg.is-ok{color:var(--win)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card h3{font-family:var(--font-display);font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.card h4{margin:0;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:var(--r-lg);text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink-2)}
.empty b{color:var(--ink);font-size:17px}
.hint{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip-warn{background:var(--tie-soft);color:var(--tie)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent);flex:none}

/* ---------- Trainers ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);display:grid;grid-template-rows:1fr auto;min-width:0;overflow:hidden}
.pcard.is-dropped{background:transparent;border-style:dashed}
.pcard.is-dropped .pcard-main{opacity:.72}
.pcard-main{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:flex-start;padding:14px 14px 10px;min-width:0;width:100%}
.pcard-main:hover .pc-name{color:var(--accent)}
.pc-text{display:grid;gap:1px;min-width:0}
.pc-name{font-weight:700;font-size:16px;overflow-wrap:anywhere;line-height:1.25}
.pc-nick{font-family:var(--font-display);font-weight:800;color:var(--accent);font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.pc-meta,.pc-fav{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.pcard-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 14px 12px;border-top:1px solid var(--line-2)}
.rstats{font-family:var(--font-data);font-size:12.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;margin-right:auto}
.status-btn{appearance:none;font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;cursor:pointer;border:1px solid var(--win);background:var(--win-soft);color:var(--win);white-space:nowrap}
.status-btn[aria-pressed="false"]{border-color:var(--line);background:transparent;color:var(--ink-2)}
.bulk{margin-bottom:16px;max-width:620px}
.roster-note{margin:12px 2px 0;font-size:13px;color:var(--ink-2)}

/* ---------- Fixtures ---------- */
.weeks-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 18px}
.wchip{
  flex:none;display:grid;gap:2px;text-align:left;padding:8px 13px 9px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:var(--ink);min-width:100px
}
.wchip b{font-family:var(--font-display);font-size:15px;font-weight:800}
.wchip small{font-family:var(--font-data);font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--win)} .dot.part{background:var(--tie)}
.wchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wchip.add{border-style:dashed;color:var(--accent);align-content:center}
.wchip.add b{font-size:14px}

.week-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-title{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.week-title h3{font-family:var(--font-display);font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}
.week-date{font-family:var(--font-data);font-size:13.5px;color:var(--ink-2)}
.date-input{width:auto;min-height:34px;padding:4px 10px;font-size:14px}
.progress{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-data);font-size:13px;color:var(--ink-2);white-space:nowrap}
.meter{width:110px;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--win);border-radius:99px}

.slips{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slip{
  display:grid;grid-template-columns:62px minmax(0,1fr) 74px minmax(0,1fr);grid-template-areas:"no a tie b";
  gap:8px;align-items:stretch;padding:8px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)
}
.tno{grid-area:no;display:grid;align-content:center;justify-items:center;font-family:var(--font-data);font-weight:700;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.tno small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.pl{
  grid-area:a;appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px 8px 9px;min-height:58px;min-width:0;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av name tag" "av meta tag";align-items:center;column-gap:10px
}
.pl-b{grid-area:b;text-align:right;padding:8px 9px 8px 12px;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"tag name av" "tag meta av"}
.pl .av{grid-area:av}
.pl:hover{border-color:var(--ink-2)}
.pl-name{grid-area:name;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.pl-meta{grid-area:meta;font-size:12.5px;color:var(--ink-2)}
.tag{grid-area:tag;font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.07em;padding:4px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.tag:empty{display:none}
.tag.t-win{background:var(--win);color:var(--win-ink)}
.tag.t-loss{background:var(--line-2);color:var(--ink-2)}
.tag.t-tie{background:var(--tie);color:var(--tie-ink)}
.tie-btn{
  grid-area:tie;appearance:none;font:inherit;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer;
  border:1px dashed var(--line);background:transparent;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px
}
.tie-btn .vs{font-family:var(--font-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.tie-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.tie-btn.is-static{cursor:default;border-color:transparent}
.tie-btn.is-static:hover{color:var(--ink-2)}
.slip[data-state="a"] .pl-a,.slip[data-state="b"] .pl-b{background:var(--win-soft);border-color:var(--win)}
.slip[data-state="a"] .pl-b,.slip[data-state="b"] .pl-a{opacity:.7}
.slip[data-state="tie"] .pl{background:var(--tie-soft);border-color:var(--tie)}
.slip[data-state="tie"] .tie-btn{background:var(--tie-soft);border:1px solid var(--tie);color:var(--tie)}
.slip.bye{grid-template-columns:62px minmax(0,1fr);grid-template-areas:"no a";background:transparent;border-style:dashed}
.bye-line{grid-area:a;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 4px}
.tag.t-bye{background:var(--accent-soft);color:var(--accent)}
.slip.editing{grid-template-columns:62px minmax(0,1fr) 30px minmax(0,1fr) 40px;grid-template-areas:"no a vs b x";align-items:center}
.slip.editing .sel-a{grid-area:a}.slip.editing .sel-b{grid-area:b}
.slip.editing .vs-txt{grid-area:vs;text-align:center;font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.slip.editing .x{grid-area:x}
.icon-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-md);background:var(--tie-soft);color:var(--ink);border:1px solid var(--tie);font-size:14px}
.info{margin:12px 0 0;font-size:14px;color:var(--ink-2)}

.bonus{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.bonus summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.bonus summary .muted{font-weight:400;font-size:13.5px}
.bonus-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px 16px;padding:0 14px 6px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-2);min-width:0}
.brow span{overflow-wrap:anywhere;min-width:0}
.stepper{display:inline-flex;align-items:center;gap:2px;flex:none}
.stepper button{appearance:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.stepper button:hover{border-color:var(--ink-2)}
.stepper output{min-width:34px;text-align:center;font-family:var(--font-data);font-weight:700}
.bonus .small{padding:4px 14px 14px;margin:0}

.new-week{gap:18px}
.nw-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.inline-field{display:flex;align-items:center;gap:8px}
.inline-field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg-btn{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:2px}
.seg-btn b{font-size:15px}
.seg-btn span{font-size:13px;color:var(--ink-2)}
.seg-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.present-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.present{display:flex;flex-wrap:wrap;gap:8px}
.pchip{appearance:none;font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px 4px 6px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;max-width:100%}
.pchip small{color:var(--ink-2);font-family:var(--font-data);font-size:11.5px}
.pchip .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-2);display:grid;place-items:center;flex:none}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pchip[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.pchip[aria-pressed="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pchip[aria-pressed="false"]{color:var(--ink-2)}
.pchip[aria-pressed="false"] .av{opacity:.5}
.nw-go{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}

/* ---------- Standings ---------- */
.table-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.table-scroll{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:720px}
table.st.has-award{min-width:860px}
.st th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.st td{padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.st tbody tr:last-child td{border-bottom:0}
.st .num{text-align:right;font-family:var(--font-data)}
.st th.num{font-family:var(--font-body)}
.st .wkcol{text-align:center;padding-inline:3px}
.st th.wkgroup{text-align:center;border-left:1px solid var(--line-2)}
.st td.wkfirst,.st th.wkfirst{border-left:1px solid var(--line-2);padding-left:10px}
.st tr.is-dropped td{color:var(--ink-2)}
.st tr.is-dropped .av{opacity:.6}
.who{display:flex;align-items:center;gap:10px}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--font-data);font-weight:700;font-size:13px;border:1px solid var(--line)}
.rank.r1{background:var(--gold);color:var(--medal-ink);border-color:transparent}
.rank.r2{background:var(--silver);color:var(--medal-ink);border-color:transparent}
.rank.r3{background:var(--bronze);color:var(--medal-ink);border-color:transparent}
.move{font-family:var(--font-data);font-size:12px;font-weight:700;width:34px}
.move.up{color:var(--win)} .move.down{color:var(--danger)} .move.same{color:var(--ink-2)}
.trainer-link{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.trainer-link:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sub{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
.pts{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1}
.wk{display:inline-grid;place-items:center;min-width:32px;height:28px;border-radius:7px;font-family:var(--font-data);font-size:12.5px;font-weight:700;padding:0 5px;position:relative;font-style:normal}
.wk sup{font-size:9.5px;margin-left:1px;top:-.45em}
.wk-win{background:var(--win-soft);color:var(--win)}
.wk-tie{background:var(--tie-soft);color:var(--tie)}
.wk-loss{background:var(--line-2);color:var(--ink-2)}
.wk-bye{background:var(--accent-soft);color:var(--accent)}
.wk-pending{border:1px dashed var(--line);color:var(--ink-2)}
.wk-absent{color:var(--ink-2);opacity:.6}
.wk-extra{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.award{display:inline-flex;gap:4px;align-items:center}
.award button{appearance:none;font:inherit;font-family:var(--font-data);font-weight:700;font-size:13.5px;min-width:42px;height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.award button:hover{border-color:var(--accent)}
.award button.minus{background:transparent;border-color:var(--line);color:var(--ink-2);min-width:36px}
.award button.minus:hover{border-color:var(--ink-2);color:var(--ink)}
.award-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:var(--r-md);background:var(--paper)}
.award-row .lbl{font-weight:700;font-size:14px;margin-right:auto}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
.pts.bump,.pts-mini.bump{display:inline-block;animation:bump .45s ease-out;color:var(--accent)}
.award-note{flex-basis:100%;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.key{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:12px 2px 0;font-size:13px;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .wk{min-width:24px;height:20px;font-size:11px}
#panel-standings:fullscreen{background:var(--paper);padding:32px 40px;overflow:auto}
#panel-standings:fullscreen .st{font-size:19px}
#panel-standings:fullscreen .pts{font-size:28px}
#panel-standings:fullscreen .panel-head h2{font-size:44px}

/* ---------- Setup ---------- */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.points-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.points-grid .input{font-family:var(--font-data);font-weight:700;text-align:center}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.card hr{border:0;border-top:1px solid var(--line-2);margin:2px 0;width:100%}
.card p{margin:0}
.lock-card{max-width:520px}

/* ---------- Dialogs ---------- */
dialog.tcard{border:1px solid var(--line);padding:0;border-radius:var(--r-lg);background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--shadow);overflow:auto}
dialog.tcard.wide{width:min(680px,calc(100vw - 32px))}
dialog.tcard::backdrop{background:var(--backdrop)}
.tc-foil{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 18px;color:var(--holo-ink);
  background:repeating-linear-gradient(125deg,transparent 0 7px,var(--foil-line) 7px 8px),linear-gradient(118deg,var(--holo-1),var(--holo-2) 30%,var(--holo-3) 55%,var(--holo-4) 78%,var(--holo-5))}
.tc-foil .icon-btn{color:var(--holo-ink)}
.tc-foil .icon-btn:hover{background:var(--chip-on-holo);color:var(--holo-ink)}
.tc-body{padding:18px;display:grid;gap:14px;margin:0}
.tc-body h2{font-family:var(--font-display);font-size:26px;font-weight:800;margin:0;line-height:1.08;letter-spacing:-.02em;overflow-wrap:anywhere}
.tc-body > p{margin:0}
.tc-id{display:flex;gap:16px;align-items:center;min-width:0}
.tc-id > div{display:grid;gap:2px;min-width:0}
.tc-about{display:grid;gap:4px;padding:10px 14px;border-radius:var(--r-md);background:var(--paper)}
.tc-about p{margin:0}
.motto{font-style:italic}
.tc-figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.tc-figs div{background:var(--paper);border-radius:var(--r-md);padding:8px 10px}
.tc-figs dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.tc-figs dd{margin:0;font-family:var(--font-data);font-weight:700;font-size:17px}
.tc-body h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.hist .h-wk{font-family:var(--font-data);font-weight:700;color:var(--ink-2);font-size:13px}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.pin-input{font-family:var(--font-data);font-size:24px;letter-spacing:.45em;text-align:center;max-width:220px;min-height:52px}
.pin-row{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px}
.pin-box{display:grid;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--paper)}
.pin-box .input{background:var(--card)}
.pin-box p{margin:0}
.code{font-family:var(--font-data);font-size:30px;font-weight:700;letter-spacing:.12em;padding:16px;border-radius:var(--r-md);background:var(--paper);text-align:center;border:1px dashed var(--line);user-select:all;-webkit-user-select:all}

.ed-av{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.ed-drop{border-radius:50%;padding:4px;border:2px dashed transparent;display:grid;place-items:center}
.ed-drop.is-over{border-color:var(--accent);background:var(--accent-soft)}
.ed-av-controls{display:grid;gap:10px;min-width:0}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--paper);justify-self:start}
.seg2 button{appearance:none;border:0;background:transparent;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink-2);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.type-sw{appearance:none;width:40px;height:40px;border-radius:50%;border:2px solid transparent;padding:2px;cursor:pointer;background:none;display:grid;place-items:center}
.type-sw .av svg{opacity:.9;width:58%;height:58%}
.type-sw:hover{border-color:var(--line)}
.type-sw[aria-pressed="true"]{border-color:var(--ink)}
.ed-badge-row{display:flex;flex-wrap:wrap;align-items:end;gap:10px}
.ed-badge-row .field{width:120px}
.ed-badge-row .input{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:opacity .2s,transform .2s;
  max-width:calc(100vw - 32px);z-index:20;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-action{display:flex;align-items:center;gap:14px}
.toast.show.has-action{pointer-events:auto}
.toast-btn{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;border-radius:8px;padding:4px 12px;cursor:pointer;flex:none}
.foot{padding-block:0 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.save-state{display:inline-flex;align-items:center;gap:8px}
.save-state .dot{background:var(--win)}
.save-state.is-off .dot{background:var(--danger)}

#print-sheet{display:none}

@media (max-width:640px){
  .slip{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"no tie" "a b"}
  .tno{display:flex;justify-content:flex-start;align-items:baseline;gap:6px;padding-left:4px;font-size:16px}
  .tno small{margin:0}
  .tie-btn{justify-self:end;flex-direction:row;gap:8px;min-height:34px;padding:4px 14px}
  .pl{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"av tag" "name name" "meta meta";row-gap:4px;padding:9px 10px}
  .pl-b{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"tag av" "name name" "meta meta"}
  .pl-b .av{justify-self:end}
  .pl .av{--s:32px!important}
  .slip.bye{grid-template-columns:minmax(0,1fr);grid-template-areas:"no" "a"}
  .slip.editing{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"no x" "a a" "b b"}
  .slip.editing .vs-txt{display:none}
  .seg{grid-template-columns:minmax(0,1fr)}
  .points-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tc-figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field-row,.ed-grid,.pin-row{grid-template-columns:minmax(0,1fr)}
  .ed-av{grid-template-columns:minmax(0,1fr);justify-items:start}
  .panel-head h2{font-size:26px}
  .mode-btn span{display:none}
  .mode-btn{padding:8px}
  .tc-id .av{--s:64px!important}
}
@media (prefers-reduced-motion: reduce){
  .title-card::after{animation:none;opacity:0}
  .toast{transition:none}
  .pts.bump,.pts-mini.bump{animation:none}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#print-sheet){display:none!important}
  body::before{display:none}
  #print-sheet{display:block;font-family:var(--font-body);color:#000}
  #print-sheet h1{font-family:var(--font-display);font-size:24pt;margin:0 0 2pt}
  #print-sheet h2{font-size:14pt;margin:0 0 14pt;font-weight:700}
  #print-sheet table{width:100%;border-collapse:collapse;font-size:13pt}
  #print-sheet th,#print-sheet td{border:1px solid #999;padding:8pt 8pt;text-align:left}
  #print-sheet th{background:#eee;font-size:10pt;text-transform:uppercase;letter-spacing:.06em}
  #print-sheet td.t{font-family:var(--font-data);font-weight:700;text-align:center;width:52pt}
  #print-sheet td.vs{text-align:center;width:28pt;color:#555}
  #print-sheet td.box{width:120pt}
  #print-sheet td.r{text-align:right;font-family:var(--font-data)}
  #print-sheet p{font-size:10.5pt;color:#333;margin-top:12pt}
}
</style>
</head>
<body>
<div class="page" id="page">
  <header class="wrap top">
    <div class="title-card" id="title-card"></div>
    <div class="notices" id="notices"></div>
  </header>

  <nav class="tabs-bar" aria-label="Sections">
    <div class="wrap bar-row">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" class="tab" role="tab" id="tab-trainers" data-action="tab" data-tab="trainers" aria-controls="panel-trainers">Trainers <span class="count" id="count-trainers">0</span></button>
        <button type="button" class="tab" role="tab" id="tab-fixtures" data-action="tab" data-tab="fixtures" aria-controls="panel-fixtures">Fixtures <span class="count" id="count-fixtures">0</span></button>
        <button type="button" class="tab" role="tab" id="tab-standings" data-action="tab" data-tab="standings" aria-controls="panel-standings">Standings</button>
        <button type="button" class="tab" role="tab" id="tab-setup" data-action="tab" data-tab="setup" aria-controls="panel-setup">Setup</button>
      </div>
      <div id="mode-slot"></div>
    </div>
  </nav>

  <main class="wrap main">
    <section id="panel-trainers" role="tabpanel" aria-labelledby="tab-trainers" hidden></section>
    <section id="panel-fixtures" role="tabpanel" aria-labelledby="tab-fixtures" hidden></section>
    <section id="panel-standings" role="tabpanel" aria-labelledby="tab-standings" hidden></section>
    <section id="panel-setup" role="tabpanel" aria-labelledby="tab-setup" hidden></section>
  </main>

  <footer class="wrap foot">
    <span class="save-state" id="save-state"><span class="dot"></span><span id="save-text">Saves automatically in this browser</span></span>
    <span>Scoring (3 for a win, 1 for a tie) and Swiss pairings follow the format used at official Pokémon events.</span>
  </footer>
</div>

<dialog class="tcard" id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-sheet"></div>
<noscript><p style="padding:16px">This page needs JavaScript switched on to run the tournament.</p></noscript>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'pokemon-tournament-desk:v1';
  var UI_KEY = 'pokemon-tournament-desk:ui';
  var TABS = ['trainers', 'fixtures', 'standings', 'setup'];
  var MAX_FAILS = 5;

  /* Badge types: [key, label, glyph path (24x24), dark lettering] */
  var TYPES = [

    var text = a && a.kind === 'badge' && a.text ? a.text : initials(t && t.name);
    return '<span class="av av-badge ty-' + key + '"' + st + ' aria-hidden="true"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="' + TYPE_MAP[key].path + '"/></svg>' +
      '<b' + (Array.from(text).length > 2 ? ' class="t3"' : '') + '>' + esc(text) + '</b></span>';
  }
  function loadAvatarFile(file, cb) {
    if (!file) return;
    var okType = /^image\//.test(file.type || '') || /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(file.name || '');
    if (!okType) { cb(null, 'Choose a picture file, such as a JPG or PNG.'); return; }
    if (file.size > 20 * 1024 * 1024) { cb(null, 'That picture is over 20 MB. Choose a smaller one.'); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var S = 200, c = document.createElement('canvas');
        c.width = c.height = S;
        var g = c.getContext('2d');
        var w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, S, S);
        g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
        g.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, S, S);
        cb(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { cb(null, 'That picture couldn\'t be used. Try a different one.'); }
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null, 'That picture couldn\'t be opened. Try a JPG or PNG.'); };
    img.src = url;
  }

  /* ---------------- PIN checks ---------------- */
  function lockedMsg(key) {
    var f = ui.fails[key];
    if (f && f.until > Date.now()) return 'Too many wrong tries. Try again in ' + Math.ceil((f.until - Date.now()) / 1000) + ' seconds.';
    return null;
  }
  function failMsg(key) {
    var f = ui.fails[key] || (ui.fails[key] = { n: 0, until: 0 });
    f.n++;
    if (f.n >= MAX_FAILS) { f.n = 0; f.until = Date.now() + 60000; return 'Too many wrong tries. Wait a minute, then try again.'; }
    return 'That PIN isn\'t right. ' + plural(MAX_FAILS - f.n, 'try', 'tries') + ' left.';
  }
  function clearFails(key) { delete ui.fails[key]; }
  function setTeacherPin(sec, pin) {
    sec.teacherHash = hashWith(sec.salt, 'teacher', pin);

    }
    var s = m.result || 'open';
    function side(id, key) {
      var t = trainer(id) || { name: 'Unknown', cls: '' }, r = stand.byId.get(id);
      var tag = s === 'open' ? '' : s === 'tie' ? 'Tie' : s === key ? 'Win' : 'Loss';

      var attrs = teach
        ? 'data-action="result" data-m="' + m.id + '" data-r="' + key + '" aria-pressed="' + (s === key) + '" aria-label="' + esc(t.name) + ' wins"'
        : 'data-action="open-trainer" data-id="' + id + '" aria-label="' + esc(t.name) + (tag ? ', ' + tag : '') + '. Open trainer card."';
      return '<button type="button" class="pl pl-' + key + '" ' + attrs + ' data-fk="r-' + m.id + '-' + key + '">' + avatarHTML(t, 38) +
        '<span class="pl-name">' + esc(t.name) + '</span><span class="pl-meta">' + (t.cls ? esc(t.cls) + ' · ' : '') + (r ? r.total : 0) + ' pts</span>' +
        '<span class="tag ' + tcls + '">' + tag + '</span></button>';
    }
    var tie = teach
      ? '<button type="button" class="tie-btn" data-action="result" data-m="' + m.id + '" data-r="tie" data-fk="r-' + m.id + '-tie" aria-pressed="' + (s === 'tie') + '" aria-label="Tie at table ' + m.table + '"><span class="vs">vs</span><span>Tie</span></button>'
      : '<span class="tie-btn is-static"><span class="vs">vs</span>' + (s === 'tie' ? '<span>Tie</span>' : '') + '</span>';
    return '<li class="slip" data-state="' + s + '"><span class="tno"><small>Table</small>' + m.table + '</span>' + side(m.a, 'a') + tie + side(m.b, 'b') + '</li>';
  }

  function editSlipHTML(m, wk) {
    var usage = {};
    wk.matches.forEach(function (o) {
      if (o.id === m.id) return;
      var label = o.b ? 'table ' + o.table : 'bye';
      usage[o.a] = label; if (o.b) usage[o.b] = label;
    });
    var pool = activeTrainers();
    [m.a, m.b].forEach(function (id) { if (id && !pool.some(function (t) { return t.id === id; })) { var t = trainer(id); if (t) pool.push(t); } });
    pool.sort(byName);
    function opts(sel, allowBye) {
      return (allowBye ? '<option value=""' + (sel ? '' : ' selected') + '>Bye (no opponent)</option>' : '') +
        pool.map(function (t) {
          return '<option value="' + t.id + '"' + (t.id === sel ? ' selected' : '') + '>' + esc(t.name) + (usage[t.id] ? ' (also ' + usage[t.id] + ')' : '') + '</option>';
        }).join('');
    }
    var label = m.b ? 'table ' + m.table : 'bye';
    return '<li class="slip editing"><span class="tno"><small>Table</small>' + (m.b ? m.table : '–') + '</span>' +
      '<select class="input sel-a" aria-label="First trainer, ' + label + '" data-change="edit-a" data-m="' + m.id + '" data-fk="ea-' + m.id + '">' + opts(m.a, false) + '</select>' +
      '<span class="vs-txt" aria-hidden="true">vs</span>' +
      '<select class="input sel-b" aria-label="Second trainer, ' + label + '" data-change="edit-b" data-m="' + m.id + '" data-fk="eb-' + m.id + '">' + opts(m.b, true) + '</select>' +
      '<button type="button" class="icon-btn x" aria-label="Remove this match" data-action="remove-match" data-m="' + m.id + '" data-fk="rm-' + m.id + '">✕</button></li>';
  }

  function bonusHTML(wk) {
    var ids = [];
    wk.matches.forEach(function (m) { ids.push(m.a); if (m.b) ids.push(m.b); });
    Object.keys(wk.bonus || {}).forEach(function (k) { if (wk.bonus[k] && trainer(k)) ids.push(k); });
    ids = ids.filter(function (id, i) { return ids.indexOf(id) === i; }).sort(function (a, b) { return tName(a).localeCompare(tName(b)); });
    if (!ids.length) return '';
    var given = Object.keys(wk.bonus || {}).filter(function (k) { return wk.bonus[k]; });
    return '<details class="bonus" id="bonus-' + wk.id + '"' + (ui.bonusOpen ? ' open' : '') + '><summary>Extra points <span class="muted">' +
      (given.length ? plural(given.length, 'trainer') + ' given extra points this week' : 'Points added with the +3 and +1 buttons, or for sportsmanship') + '</span></summary>' +
      '<div class="bonus-list">' + ids.map(function (id) {
        var n = (wk.bonus && wk.bonus[id]) || 0, nm = esc(tName(id));
        return '<div class="brow"><span>' + nm + '</span><div class="stepper">' +
          '<button type="button" data-action="bonus" data-w="' + wk.id + '" data-id="' + id + '" data-d="-1" data-fk="bm-' + id + '" aria-label="One less extra point for ' + nm + '">−</button>' +
          '<output aria-live="polite">' + (n > 0 ? '+' + n : n) + '</output>' +
          '<button type="button" data-action="bonus" data-w="' + wk.id + '" data-id="' + id + '" data-d="1" data-fk="bp-' + id + '" aria-label="One more extra point for ' + nm + '">+</button></div></div>';
      }).join('') + '</div><p class="small muted">Extra points add to a trainer\'s total but don\'t change their win-loss record or the tiebreakers.</p></details>';
  }

  /* ----- Standings ----- */
  function standingsRows() {
    var stand = computeStandings(state);
    var rows = ui.hideDropped ? stand.rows.filter(function (r) { return r.t.active; }) : stand.rows;
    return { stand: stand, rows: rows };
  }

  function renderStandings() {
    var el = $('#panel-standings');
    var teach = canTeach();
    var rows = standingsRows().rows;
    var last = lastResultWeekIndex();
    var anyPoints = rows.some(function (r) { return r.total !== 0; });
    var prevRank = null;
    if (last >= 1) {
      var prev = computeStandings(state, { upto: last - 1 }).rows;
      if (ui.hideDropped) prev = prev.filter(function (r) { return r.t.active; });
      prevRank = new Map(prev.map(function (r, i) { return [r.id, i + 1]; }));
    }
    var anyResult = last >= 0;
    var anyBonus = rows.some(function (r) { return r.bonus; });
    var weeks = state.weeks;
    var fs = !!document.fullscreenElement;
    var canFS = !!(document.fullscreenEnabled && el.requestFullscreen);
    var html = '<div class="panel-head"><div><h2>Standings</h2><p>' +
      (anyResult ? 'After Week ' + (last + 1) + '. Ties on points are split by opponents\' win %.' : anyPoints ? 'Points so far this season.' : 'The table fills in as points and results are added.') +
      (teach ? ' Tap +3 or +1 to add points to a trainer' + (weeks.length ? ' for Week ' + weeks.length : '') + '.' : '') + '</p></div>' +
      '<div class="tools">' +
        '<label class="switch"><input type="checkbox" id="hide-dropped" data-change="hide-dropped" data-fk="hide-dropped"' + (ui.hideDropped ? ' checked' : '') + '> Hide dropped</label>' +
        (teach ? '<button type="button" class="btn" data-action="copy-standings" data-fk="copy-st">Copy table</button>' +
          '<button type="button" class="btn" data-action="print-standings" data-fk="print-st">Print</button>' : '') +
        (canFS ? '<button type="button" class="btn btn-primary" data-action="present" data-fk="present">' + (fs ? 'Exit full screen' : 'Show on the board') + '</button>' : '') +
      '</div></div>';

    if (!state.trainers.length) {
      el.innerHTML = html + '<div class="empty"><b>No trainers yet</b><span>Trainers appear here once they join and play.</span><button type="button" class="btn btn-primary" data-action="tab" data-tab="trainers">Go to Trainers</button></div>';
      return;
    }
    html += '<div class="table-card"><div class="table-scroll"><table class="st' + (teach ? ' has-award' : '') + '"><thead>';
    if (weeks.length) {
      html += '<tr><th colspan="' + (7 + (anyBonus ? 1 : 0) + (teach ? 1 : 0)) + '"></th><th class="wkgroup" colspan="' + weeks.length + '">Points by week</th></tr>';
    }
    html += '<tr><th scope="col">#</th><th scope="col"><span class="vh">Change</span></th><th scope="col">Trainer</th>' +
      '<th scope="col" class="num" title="Matches played, including byes">Played</th><th scope="col" class="num" title="Wins-Losses-Ties">W-L-T</th>' +
      (anyBonus ? '<th scope="col" class="num" title="Points added with the +3 and +1 buttons">Extra</th>' : '') +
      '<th scope="col" class="num">Pts</th>' +
      (teach ? '<th scope="col">Add points</th>' : '') +
      '<th scope="col" class="num" title="Opponents\' win percentage">OWP</th>' +
      weeks.map(function (w, i) { return '<th scope="col" class="wkcol' + (i === 0 ? ' wkfirst' : '') + '" title="' + esc(fmtDate(w.date, true)) + '">W' + (i + 1) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var rank = i + 1, t = r.t;
      var medal = rank <= 3 && r.total > 0 ? ' r' + rank : '';
      var mv = '';
      if (prevRank && prevRank.has(r.id)) {
        var d = prevRank.get(r.id) - rank;
        mv = d > 0 ? '<span class="move up" aria-label="Up ' + d + '">▲' + d + '</span>' : d < 0 ? '<span class="move down" aria-label="Down ' + (-d) + '">▼' + (-d) + '</span>' : '<span class="move same" aria-label="No change">–</span>';
      }
      var sub = [t.nick, t.cls].filter(Boolean).map(esc).join(' · ') + (t.active ? '' : ((t.nick || t.cls) ? ' · ' : '') + 'Dropped');
      html += '<tr class="' + (t.active ? '' : 'is-dropped') + '">' +
        '<td><span class="rank' + medal + '">' + rank + '</span></td><td class="move">' + mv + '</td>' +
        '<td><div class="who">' + avatarHTML(t, 32) + '<div><button type="button" class="trainer-link" data-action="open-trainer" data-id="' + r.id + '" data-fk="st-' + r.id + '">' + esc(t.name) + '</button>' +
          (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div></div></td>' +
        '<td class="num">' + (r.played + r.byes) + '</td>' +
        '<td class="num">' + (r.w + r.byes) + '-' + r.l + '-' + r.d + '</td>' +
        (anyBonus ? '<td class="num">' + (r.bonus ? (r.bonus > 0 ? '+' : '') + r.bonus : '–') + '</td>' : '') +
        '<td class="num"><span class="pts' + (ui.flash === r.id ? ' bump' : '') + '">' + r.total + '</span></td>' +
        (teach ? '<td>' + awardButtons(t, 'aw') + '</td>' : '') +
        '<td class="num">' + (r.played ? Math.round(r.owp * 100) + '%' : '–') + '</td>' +
        weeks.map(function (w, wi) { return '<td class="wkcol' + (wi === 0 ? ' wkfirst' : '') + '">' + weekCell(r.weekly[w.id], wi + 1, t.name) + '</td>'; }).join('') +
        '</tr>';
    });
    html += '</tbody></table></div></div>';
    var P = state.settings.points;
    html += '<div class="key"><span><i class="wk wk-win">' + P.win + '</i>Win</span><span><i class="wk wk-tie">' + P.tie + '</i>Tie</span><span><i class="wk wk-loss">' + P.loss + '</i>Loss</span>' +
      '<span><i class="wk wk-bye">' + P.bye + '</i>Bye</span><span><i class="wk wk-pending">…</i>Result to come</span><span><i class="wk wk-absent">–</i>Not playing</span>' +
      '<span><i class="wk wk-extra">+3</i>Extra points only</span>' +
      '<span>Small numbers are extra points. OWP is the average win rate of a trainer\'s opponents.</span></div>';
    el.innerHTML = html;
  }

  function awardButtons(t, fk, noMinus) {
    var nm = esc(t.name);
    return '<span class="award">' +
      '<button type="button" data-action="award" data-id="' + t.id + '" data-n="3" data-fk="' + fk + '3-' + t.id + '" aria-label="Add 3 points to ' + nm + '" title="Add 3 points">+3</button>' +
      '<button type="button" data-action="award" data-id="' + t.id + '" data-n="1" data-fk="' + fk + '1-' + t.id + '" aria-label="Add 1 point to ' + nm + '" title="Add 1 point">+1</button>' +
      (noMinus ? '' : '<button type="button" class="minus" data-action="award" data-id="' + t.id + '" data-n="-1" data-fk="' + fk + 'm-' + t.id + '" aria-label="Take 1 point away from ' + nm + '" title="Take 1 point away">−1</button>') +
      '</span>';
  }
  function awardPoints(id, n) {
    var t = trainer(id);
    if (!t || !n) return;
    var weekNo = state.weeks.length;
    var wk = state.weeks[weekNo - 1];
    var bucket = wk ? (wk.bonus = wk.bonus || {}) : (state.extra = state.extra || {});
    function apply(d) {
      bucket[id] = (bucket[id] || 0) + d;
      if (!bucket[id]) delete bucket[id];
      ui.flash = id;
      commit(); render();
      if (ui.dialog && ui.dialog.kind === 'view') renderDialog();
      setTimeout(function () { if (ui.flash === id) ui.flash = null; }, 700);
      return computeStandings(state).byId.get(id).total;
    }
    var total = apply(n);
    var label = (n > 0 ? '+' + n : '−' + (-n)) + (Math.abs(n) === 1 ? ' point' : ' points');
    toast(label + ' for ' + t.name + (wk ? ' in Week ' + weekNo : '') + '. Now on ' + total + '.', function () {
      var back = apply(-n);
      toast('Undone. ' + t.name + ' is back on ' + back + ' points.');
    });
  }

  function weekCell(c, n, name) {
    if (!c) return '<span class="wk wk-absent" title="' + esc(name) + ' didn\'t play in week ' + n + '">–</span>';
    if (c.kind === 'none') return '<span class="wk wk-extra" title="Week ' + n + ': extra points only">' + (c.bonus > 0 ? '+' : '') + c.bonus + '</span>';
    var label = { win: 'Win', loss: 'Loss', tie: 'Tie', bye: 'Bye', pending: 'Result to come' }[c.kind];
    var sup = c.bonus ? '<sup>' + (c.bonus > 0 ? '+' : '') + c.bonus + '</sup>' : '';
    var title = 'Week ' + n + ': ' + label + (c.kind !== 'pending' ? ' (' + c.pts + ')' : '') + (c.bonus ? ', extra ' + c.bonus : '');
    if (c.kind === 'pending') return '<span class="wk wk-pending" title="' + esc(title) + '">…' + sup + '</span>';
    return '<span class="wk wk-' + c.kind + '" title="' + esc(title) + '">' + c.pts + sup + '</span>';
  }

          '<div class="field"><label for="set-format">Match format</label><select id="set-format" class="input" data-change="set-format" data-fk="set-format">' + sel(['Best of 1', 'Best of 3'], s.format) + '</select></div>' +

        '<div class="field-row">' +

          '<div class="field"><label for="set-weeks">Weeks in the season</label><input id="set-weeks" class="input" type="number" min="1" max="40" inputmode="numeric" value="' + esc(s.weeksPlanned) + '" data-change="set-weeks" data-fk="set-weeks"></div>' +

        '<label class="switch"><input type="checkbox" id="set-photos" data-change="set-photos" data-fk="set-photos"' + (s.allowPhotos ? ' checked' : '') + '> Allow profile pictures</label>' +

  function renderSaveState() {
    var el = $('#save-state'), txt = $('#save-text');
    el.classList.toggle('is-off', !storageOK);
    if (!storageOK) txt.textContent = 'This browser isn\'t saving changes. Download a backup from Setup before closing.';
    else if (lastSaved) txt.textContent = 'Saved in this browser at ' + lastSaved.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    else txt.textContent = state.example ? 'Example league. Changes save automatically in this browser.' : 'Saves automatically in this browser';

  /* ---------------- dialogs ---------------- */
  function dlgHead(label) {
    return '<div class="tc-foil"><span class="eyebrow">' + esc(label) + '</span><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close">✕</button></div>';
  }
  function msgHTML(err, ok) {
    return '<p class="form-msg' + (err ? ' is-error' : ok ? ' is-ok' : '') + '" role="alert">' + esc(err || ok || '') + '</p>';
  }
  function pinField(id, label, max, fk, extra) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" class="input pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="' + max + '" autocomplete="off" data-digits data-fk="' + (fk || id) + '"' + (extra || '') + '></div>';
  }

  function openDialog(d) { ui.dialog = d; renderDialog(true); }
  function closeDialog() {
    ui.dialog = null; ui.draft = null;
    var dlg = $('#dlg');
    if (dlg.open) { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
    dlg.innerHTML = '';
  }
  function renderDialog(first) {
    var dlg = $('#dlg'), d = ui.dialog;
    if (!d) { closeDialog(); return; }
    var a = document.activeElement;
    var fk = a && dlg.contains(a) ? a.getAttribute('data-fk') : null;
    var top = dlg.scrollTop;
    dlg.className = 'tcard' + (d.kind === 'editor' || d.kind === 'view' ? ' wide' : '');
    dlg.innerHTML = dialogHTML(d);
    if (!dlg.open) {
      if (dlg.showModal) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
      else dlg.setAttribute('open', '');
    }
    var target = null;
    if (first) { dlg.scrollTop = 0; target = dlg.querySelector('[data-autofocus]'); }
    else {
      dlg.scrollTop = top;
      target = (fk && dlg.querySelector('[data-fk="' + fk + '"]')) || dlg.querySelector('[data-autofocus]');
    }
    if (target) { try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); } }
  }
  function dialogHTML(d) {
    if (d.kind === 'view') return viewHTML(d);
    if (d.kind === 'pin') return pinHTML(d);
    if (d.kind === 'editor') return editorHTML();
    if (d.kind === 'teacher') return d.recover ? recoverHTML(d) : teacherHTML(d);
    if (d.kind === 'set-teacher') return setTeacherHTML(d);
    if (d.kind === 'recovery') return recoveryHTML(d);
    return '';

  function standingsText() {
    var rows = standingsRows().rows, last = lastResultWeekIndex();
    var lines = [state.settings.name + ': standings' + (last >= 0 ? ' after Week ' + (last + 1) : '')];
    rows.forEach(function (r, i) {
      lines.push((i + 1) + '. ' + r.t.name + (r.t.cls ? ' (' + r.t.cls + ')' : '') + ': ' + r.total + ' pts, ' + (r.w + r.byes) + '-' + r.l + '-' + r.d);
    });
    return lines.join('\n');
  }
  function copyText(text, okMsg, failMsgText) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? okMsg : failMsgText);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    else fallback();
  }
  function exportBackup() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var slug = (state.settings.name || 'league').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'league';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = slug + '-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Backup downloaded.');
  }

  var toastTimer = null;
  function toast(msg, undo) {
    var el = $('#toast');
    ui.undo = undo || null;
    /* An open trainer card covers the toast, so show the message inside the card instead */
    if (ui.dialog && ui.dialog.kind === 'view' && $('#dlg').open && canTeach()) {
      ui.dialog.note = { msg: msg, undo: !!undo };
      renderDialog();
      return;
    }
    el.textContent = '';
    var span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if (undo) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-btn'; b.textContent = 'Undo';
      b.setAttribute('data-action', 'undo-toast');
      el.appendChild(b);
    }
    el.classList.toggle('has-action', !!undo);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); ui.undo = null; }, undo ? 6000 : 3400);
  }
