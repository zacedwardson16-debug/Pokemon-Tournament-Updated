    'tab': function (el) { showTab(el.getAttribute('data-tab')); },
    'close-dialog': function () { closeDialog(); },
    'teacher-unlock': function () {
      if (!hasTeacherPin()) openDialog({ kind: 'set-teacher', ctx: 'first' });
      else openDialog({ kind: 'teacher', err: '' });
    },
    'lock': function () { lockTeacher(); },
    'start-own': function () { openDialog({ kind: 'set-teacher', ctx: 'start' }); },
    'first-teacher-pin': function () { openDialog({ kind: 'set-teacher', ctx: 'first' }); },
    'change-teacher-pin': function () { openDialog({ kind: 'set-teacher', ctx: hasTeacherPin() ? 'change' : 'first' }); },
    'forgot-teacher': function () { if (ui.dialog) { ui.dialog.recover = true; ui.dialog.err = ''; renderDialog(true); } },
    'back-teacher': function () { if (ui.dialog) { ui.dialog.recover = false; ui.dialog.err = ''; renderDialog(true); } },
    'copy-code': function () { if (ui.dialog && ui.dialog.code) copyText(ui.dialog.code, 'Recovery code copied.', 'Couldn\'t copy here. Write the code down instead.'); },
    'recovery-done': function () { closeDialog(); render(); },
    'open-trainer': function (el) { openDialog({ kind: 'view', id: el.getAttribute('data-id') }); },
    'edit-profile': function (el) {
      var id = el.getAttribute('data-id');
      if (!trainer(id)) return;
      if (canTeach()) openEditor(id, 'teacher');
      else openDialog({ kind: 'pin', id: id, err: '' });
    },
    'join': function () {
      if (canTeach()) openEditor(null, 'teacher');
      else if (state.settings.allowSignup) openEditor(null, 'student');
    },
    'ed-tab': function (el) { if (ui.draft) { ui.draft.avTab = el.getAttribute('data-v'); ui.draft.err = ''; renderDialog(); } },
    'ed-type': function (el) { if (ui.draft) { ui.draft.badgeType = el.getAttribute('data-v'); renderDialog(); } },
    'ed-remove-photo': function () { if (ui.draft) { ui.draft.photo = null; renderDialog(); } },
    'pick-week': function (el) {
      var id = el.getAttribute('data-id');
      if (id === 'new' && !canTeach()) return;
      ui.week = id; ui.editWeek = null; render();
    },
    'nw-method': function (el) { ui.newMethod = el.getAttribute('data-v'); render(); },
    'nw-toggle': function (el) {
      var id = el.getAttribute('data-id');
      if (ui.present.has(id)) ui.present.delete(id); else ui.present.add(id);
      render();
    },
    'nw-all': function () { ui.present = new Set(activeTrainers().map(function (t) { return t.id; })); render(); },
    'nw-none': function () { ui.present = new Set(); render(); },
    'make-pairings': function () {
      var ids = activeTrainers().filter(function (t) { return ui.present.has(t.id); }).map(function (t) { return t.id; });
      if (ids.length < 2) return;
      var method = ui.newMethod || state.settings.pairing;
      var res = makePairings(state, ids, method);
      var wk = { id: uid(), date: ui.newDate || todayISO(), matches: res.matches, bonus: {} };
      state.weeks.push(wk);
      ui.week = wk.id; ui.present = null; ui.newDate = null; ui.newMethod = null;
      commit(); render();
      toast('Week ' + state.weeks.length + ' pairings are ready.' + (res.rematch ? ' Some trainers had to meet a previous opponent.' : ''));
    },
    'result': function (el) {
      var f = findMatch(el.getAttribute('data-m'));
      if (!f || !f.match.b) return;
      var r = el.getAttribute('data-r');
      f.match.result = f.match.result === r ? null : r;
      commit(); render();
    },
    'edit-week': function (el) { ui.editWeek = el.getAttribute('data-id'); render(); },
    'done-edit': function () { ui.editWeek = null; render(); },
    'add-match': function (el) {
      var wk = weekById(el.getAttribute('data-id'));
      if (!wk) return;
      var used = new Set();
      wk.matches.forEach(function (m) { used.add(m.a); if (m.b) used.add(m.b); });
      var act = activeTrainers();
      var free = act.filter(function (t) { return !used.has(t.id); });
      if (!act.length) return;
      var a = (free[0] || act[0]).id, b = free[1] ? free[1].id : null;
      wk.matches.push({ id: uid(), table: null, a: a, b: b, result: b ? null : 'bye' });
      renumber(wk); commit(); render();
    },
    'remove-match': function (el) {
      var f = findMatch(el.getAttribute('data-m'));
      if (!f) return;
      f.week.matches = f.week.matches.filter(function (m) { return m !== f.match; });
      renumber(f.week); commit(); render();
    },
    'repair': function (el) {
      var wk = weekById(el.getAttribute('data-id'));
      if (!wk) return;
      var ids = [];
      wk.matches.forEach(function (m) { ids.push(m.a); if (m.b) ids.push(m.b); });
      ids = ids.filter(function (id, i) { return ids.indexOf(id) === i; });
      var res = makePairings(state, ids, state.settings.pairing, Math.random, wk.id);
      wk.matches = res.matches;
      commit(); render(); toast('New pairings made.' + (res.rematch ? ' Some trainers had to meet a previous opponent.' : ''));
    },
    'del-week': function (el) {
      var id = el.getAttribute('data-id');
      if (!askConfirm('del-week:' + id)) return;
      state.weeks = state.weeks.filter(function (w) { return w.id !== id; });
      ui.week = null; ui.editWeek = null;
      commit(); render(); toast('Week deleted.');
    },
    'print-week': function (el) { var wk = weekById(el.getAttribute('data-id')); if (wk) printWeek(wk); },
    'award': function (el) { awardPoints(el.getAttribute('data-id'), Number(el.getAttribute('data-n')) || 0); },
    'undo-toast': function () {
      var f = ui.undo; ui.undo = null;
      $('#toast').classList.remove('show');
      if (f) f();
    },
    'bonus': function (el) {
      var wk = weekById(el.getAttribute('data-w')), id = el.getAttribute('data-id');
      if (!wk) return;
      wk.bonus = wk.bonus || {};
      var n = Math.max(-99, Math.min(99, (wk.bonus[id] || 0) + Number(el.getAttribute('data-d'))));
      if (n) wk.bonus[id] = n; else delete wk.bonus[id];
      ui.bonusOpen = true; saveUI();
      commit(); render();
    },
    't-status': function (el) {
      var t = trainer(el.getAttribute('data-id'));
      if (!t) return;
      t.active = !t.active; ui.present = null;
      commit(); render();
      toast(t.active ? t.name + ' is back in the pairings.' : t.name + ' is dropped. Their results stay in the table.');
    },
    't-del': function (el) {
      var id = el.getAttribute('data-id');
      if (inAnyMatch().has(id)) return;
      if (!askConfirm('del:' + id)) return;
      var t = trainer(id);
      state.trainers = state.trainers.filter(function (x) { return x.id !== id; });
      ui.present = null;
      commit(); render(); if (t) toast(t.name + ' deleted.');
    },
    'toggle-bulk': function () { ui.bulkOpen = !ui.bulkOpen; render(); if (ui.bulkOpen) { var ta = $('#bulk-text'); if (ta) ta.focus(); } },
    'bulk-add': function () {
      var ta = $('#bulk-text'), added = 0, skipped = 0;
      if (!ta) return;
      String(ta.value || '').split(/\r?\n/).forEach(function (line) {
        var parts = line.split(/\t|,/).map(function (p) { return p.trim(); });
        if (!parts[0]) return;
        var r = addTrainer(parts[0], parts[1], parts[2]);
        if (r.ok) added++; else skipped++;
      });
      var text = !added && !skipped ? 'Paste at least one name, one per line.'
        : 'Added ' + plural(added, 'trainer') + '.' + (skipped ? ' Skipped ' + skipped + ' already on the list.' : '');
      if (added) { commit(); render(); }
      var msg = $('#bulk-msg');
      if (msg) { msg.textContent = text; msg.className = 'form-msg ' + (added ? 'is-ok' : 'is-error'); }
    },
    'copy-standings': function () { copyText(standingsText(), 'Standings copied. Paste them into an email or message.', 'Couldn\'t copy here. Try Print instead.'); },
    'print-standings': function () { printStandings(); },
    'present': function () {
      var p = $('#panel-standings');
      if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); return; }
      var req = p.requestFullscreen && p.requestFullscreen();
      if (req && req.catch) req.catch(function () { toast('Full screen isn\'t available here.'); });
    },
    'export': function () { exportBackup(); },
    'reset-results': function () {
      if (!askConfirm('reset-results')) return;
      state.weeks = []; state.extra = {}; state.example = false; ui.week = null; ui.editWeek = null;
      state.trainers.forEach(function (t) { t.active = true; });
      commit(); render(); toast('All weeks cleared. Trainers kept.');
    },
    'reset-all': function () {
      if (!askConfirm('reset-all')) return;
      state = emptyState(state.settings, state.security); ui.week = null; ui.editWeek = null; ui.present = null;
      commit(); render(); toast('Everything cleared. Your teacher PIN is unchanged.');
    },
    'load-example': function () {
      if (!state.example && !askConfirm('load-example')) return;
      ui.confirm = null;
      state = exampleState(); ui.week = null; ui.editWeek = null; ui.present = null; ui.teacher = false;
      commit(); render(); toast('Example league loaded. Its teacher PIN is 1234.');
    }
  };

  var forms = {
    'pin': function (f) {
      var d = ui.dialog, t = trainer(d.id);
      if (!t || !t.pinHash) { closeDialog(); return; }
      var lock = lockedMsg(t.id);
      if (lock) { d.err = lock; renderDialog(); return; }
      var v = f.querySelector('#pin-in').value;
      if (hashWith(state.security.salt, t.id, v) === t.pinHash) { clearFails(t.id); openEditor(t.id, 'student'); }
      else { d.err = failMsg(t.id); renderDialog(); }
    },
    'teacher': function (f) {
      var d = ui.dialog;
      var lock = lockedMsg('teacher');
      if (lock) { d.err = lock; renderDialog(); return; }
      var v = f.querySelector('#teacher-pin').value;
      if (hasTeacherPin() && hashWith(state.security.salt, 'teacher', v) === state.security.teacherHash) {
        clearFails('teacher'); ui.teacher = true; ui.lastActive = Date.now();
        closeDialog(); render(); toast('Teacher mode is on.');
      } else { d.err = failMsg('teacher'); renderDialog(); }
    },
    'recover': function (f) {
      var d = ui.dialog, sec = state.security;
      var lock = lockedMsg('recovery');
      if (lock) { d.err = lock; renderDialog(); return; }
      var code = normCode(f.querySelector('#rc-code').value), p1 = f.querySelector('#rc-pin1').value, p2 = f.querySelector('#rc-pin2').value;
      if (!sec.recoveryHash || hashWith(sec.salt, 'recovery', code) !== sec.recoveryHash) { d.err = failMsg('recovery').replace('That PIN', 'That code'); renderDialog(); return; }
      if (!/^\d{4,8}$/.test(p1)) { d.err = 'The new PIN needs 4 to 8 digits.'; renderDialog(); return; }
      if (p1 !== p2) { d.err = 'The two PINs don\'t match. Type them again.'; renderDialog(); return; }
      clearFails('recovery');
      var newCode = setTeacherPin(sec, p1);
      ui.teacher = true; ui.lastActive = Date.now();
      commit();
      openDialog({ kind: 'recovery', code: newCode });
      render();
    },
    'set-teacher': function (f) {
      var d = ui.dialog;
      var p1 = f.querySelector('#st-pin1').value, p2 = f.querySelector('#st-pin2').value;
      if (!/^\d{4,8}$/.test(p1)) { d.err = 'The teacher PIN needs 4 to 8 digits.'; renderDialog(); return; }
      if (p1 !== p2) { d.err = 'The two PINs don\'t match. Type them again.'; renderDialog(); return; }
      var code;
      if (d.ctx === 'start') {
        var sec = newSecurity();
        code = setTeacherPin(sec, p1);
        state = emptyState(null, sec);
        ui.week = null; ui.editWeek = null; ui.present = null; ui.tab = 'trainers'; saveUI();
        try { history.replaceState(null, '', '#trainers'); } catch (e) { /* ignore */ }
      } else {
        code = setTeacherPin(state.security, p1);
      }
      ui.teacher = true; ui.lastActive = Date.now();
      commit();
      openDialog({ kind: 'recovery', code: code });
      render();
    },
    'editor': function () {
      var d = ui.draft;
      if (!d) return;
      var teach = d.auth === 'teacher', isNew = !d.id;
      if (teach && !canTeach()) { closeDialog(); toast('Teacher mode is locked. Unlock it to save changes.'); return; }
      if (isNew && !teach && !state.settings.allowSignup) { setDraftErr('Joining is switched off. Ask your teacher to add you.'); return; }
      var name = str(d.name, 40);
      if (!name) { setDraftErr(teach ? 'Type the trainer\'s name.' : 'Type your name.'); return; }
      var lower = name.toLowerCase();
      if (state.trainers.some(function (t) { return t.id !== d.id && t.name.toLowerCase() === lower; })) {
        setDraftErr('There\'s already a trainer called ' + name + '. Add an initial to tell you apart.'); return;
      }
      var needPin = isNew && !teach;
      if (needPin || d.pin1 || d.pin2) {
        if (!/^\d{4}$/.test(d.pin1)) { d.pin1 = ''; d.pin2 = ''; setDraftErr('A PIN is exactly 4 digits.'); return; }
        if (d.pin1 !== d.pin2) { d.pin1 = ''; d.pin2 = ''; setDraftErr('The two PINs don\'t match. Type them again.'); return; }
      }
      var t = d.id ? trainer(d.id) : null;
      if (d.id && !t) { setDraftErr('This trainer isn\'t in the league any more.'); return; }
      var before = t ? JSON.stringify(t) : null;
      if (!t) { t = { id: uid(), active: true, pinHash: null }; state.trainers.push(t); }
      t.name = name; t.cls = str(d.cls, 12); t.nick = str(d.nick, 24); t.fav = str(d.fav, 30); t.deck = str(d.deck, 30); t.motto = str(d.motto, 60);
      var prevPhoto = before ? JSON.parse(before).avatar : null;
      t.avatar = draftAvatar(d);
      if (!state.settings.allowPhotos && prevPhoto && prevPhoto.kind === 'photo' && d.avTab !== 'photo' && d.badgeType === defaultTypeFor(t) && !d.badgeText) t.avatar = prevPhoto;
      if (d.pin1) t.pinHash = hashWith(state.security.salt, t.id, d.pin1);
      if (!commit()) {
        if (before) { var i = state.trainers.indexOf(t); state.trainers[i] = JSON.parse(before); }
        else state.trainers = state.trainers.filter(function (x) { return x !== t; });
        commit();
        setDraftErr('This device has run out of space for pictures. Use a badge instead, or remove some pictures from other cards.');
        return;
      }
      ui.present = null;
      closeDialog(); render();
      toast(isNew ? (teach ? name + ' added.' : 'Welcome to the league, ' + name + '!') : 'Card saved.');
    }
  };

  var changes = {
    'nw-date': function (el) { ui.newDate = el.value; },
    'week-date': function (el) {
      var wk = weekById(el.getAttribute('data-id'));
      if (wk) { wk.date = el.value; commit(); render(); }
    },
    'edit-a': function (el) {
      var f = findMatch(el.getAttribute('data-m'));
      if (!f || f.match.a === el.value) return;
      f.match.a = el.value; f.match.result = f.match.b ? null : 'bye';
      renumber(f.week); commit(); render();
    },
    'edit-b': function (el) {
      var f = findMatch(el.getAttribute('data-m'));
      var v = el.value || null;
      if (!f || f.match.b === v) return;
      f.match.b = v; f.match.result = v ? null : 'bye';
      renumber(f.week); commit(); render();
    },
    'hide-dropped': function (el) { ui.hideDropped = el.checked; saveUI(); render(); },
    'set-game': function (el) { state.settings.game = el.value; commit(); renderHeader(); },
    'set-format': function (el) { state.settings.format = el.value; commit(); renderHeader(); },
    'set-pairing': function (el) { state.settings.pairing = el.value; ui.newMethod = null; commit(); renderHeader(); },
    'set-weeks': function (el) {
      var n = Math.max(1, Math.min(40, parseInt(el.value, 10) || 1));
      el.value = n; state.settings.weeksPlanned = n; commit(); renderHeader();
    },
    'set-points': function (el) {
      var k = el.getAttribute('data-k');
      var n = Math.max(0, Math.min(20, parseInt(el.value, 10) || 0));
      el.value = n; state.settings.points[k] = n; commit(); renderHeader();
    },
    'set-signup': function (el) { state.settings.allowSignup = el.checked; commit(); render(); },
    'set-photos': function (el) { state.settings.allowPhotos = el.checked; commit(); render(); },
    'set-lock': function (el) { state.settings.lockMinutes = Number(el.value) || 10; commit(); },
    'ed-file': function (el) {
      var file = el.files && el.files[0];
      el.value = '';
      if (file) applyPhoto(file);
    },
    'import': function (el) {
      var file = el.files && el.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          if (!data || !Array.isArray(data.trainers) || !Array.isArray(data.weeks)) throw new Error('shape');
          var keepSec = state.security;
          var next = normalize(data);
          if (!(data.security && data.security.teacherHash)) next.security = keepSec;
          state = next; ui.week = null; ui.editWeek = null; ui.present = null;
          commit(); render(); toast('Backup restored: ' + plural(state.trainers.length, 'trainer') + ', ' + plural(state.weeks.length, 'week') + '.');
        } catch (e) {
          toast('That file isn\'t a league backup. Choose a .json file downloaded from this page.');
        }
        el.value = '';
      };
      reader.onerror = function () { toast('Couldn\'t read that file. Try choosing it again.'); el.value = ''; };
      reader.readAsText(file);
    }
  };

  var inputs = {
    'set-name': function (el) { if (!canTeach()) return; state.settings.name = el.value.slice(0, 60); commit(); renderHeader(); }
  };

  function requireTeacher() {
    if (canTeach()) return true;
    openDialog({ kind: 'teacher', err: '' });
    return false;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var name = el.getAttribute('data-action');
    var fn = actions[name];
    if (!fn) return;
    e.preventDefault();
    if (TEACHER_ONLY.has(name) && !requireTeacher()) return;
    fn(el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest('[data-change]');
    if (!el) return;
    var name = el.getAttribute('data-change');
    if (!changes[name]) return;
    if (TEACHER_CHANGES.has(name) && !requireTeacher()) { render(); return; }
    changes[name](el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    if (el.hasAttribute('data-digits')) {
      var clean = el.value.replace(/\D/g, '');
      if (clean !== el.value) el.value = clean;
    }
    var dk = el.getAttribute('data-draft');
    if (dk && ui.draft) {
      if (dk === 'badgeText') { var bt = cleanBadgeText(el.value); if (bt !== el.value) el.value = bt; ui.draft.badgeText = bt; }
      else ui.draft[dk] = el.value;
      if (dk === 'name' || dk === 'badgeText' || dk === 'deck') {
        var pv = $('#ed-preview'); if (pv) pv.innerHTML = draftPreview();
        var bti = $('#ed-badge-text'); if (bti && dk === 'name') bti.placeholder = initials(ui.draft.name);
      }
      return;
    }
    var ik = el.getAttribute('data-input');
    if (ik && inputs[ik]) inputs[ik](el, e);
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    var fn = forms[f.getAttribute('data-form')];
    if (fn) fn(f);
  });
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('bonus')) { ui.bonusOpen = e.target.open; saveUI(); }
  }, true);

  /* Drop a picture onto the avatar circle in the editor */
  document.addEventListener('dragover', function (e) {
    var z = e.target.closest && e.target.closest('.ed-drop');
    if (!z || !ui.draft || !state.settings.allowPhotos) return;
    e.preventDefault(); z.classList.add('is-over');
  });
  document.addEventListener('dragleave', function (e) {
    var z = e.target.closest && e.target.closest('.ed-drop');
    if (z) z.classList.remove('is-over');
  });
  document.addEventListener('drop', function (e) {
    var z = e.target.closest && e.target.closest('.ed-drop');
    if (!z || !ui.draft || !state.settings.allowPhotos) return;
    e.preventDefault(); z.classList.remove('is-over');
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) applyPhoto(file);
  });

  var dlg = $('#dlg');
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeDialog(); });
  dlg.addEventListener('cancel', function (e) { e.preventDefault(); closeDialog(); });

  $('#tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'Home' && e.key !== 'End') return;
    var i = TABS.indexOf(ui.tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
    e.preventDefault();
    showTab(TABS[i]);
    $('#tab-' + TABS[i]).focus();
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (TABS.indexOf(h) >= 0 && h !== ui.tab) showTab(h);
  });
  document.addEventListener('fullscreenchange', function () { if (ui.tab === 'standings') render(); });

  /* Teacher mode locks itself after a spell without use */
  function touch() { if (ui.teacher) ui.lastActive = Date.now(); }
  document.addEventListener('pointerdown', touch, true);
  document.addEventListener('keydown', touch, true);
  setInterval(function () {
    if (ui.teacher && hasTeacherPin() && Date.now() - ui.lastActive > state.settings.lockMinutes * 60000) {
      lockTeacher('Teacher mode locked after ' + state.settings.lockMinutes + ' minutes without use.');
    }
  }, 15000);

  /* ---------------- start ---------------- */
  var h = location.hash.slice(1);
  ui.tab = TABS.indexOf(h) >= 0 ? h : (TABS.indexOf(savedUI.tab) >= 0 ? savedUI.tab : 'trainers');
  render();
  renderSaveState();
})();
</script>
</body>
</html>
